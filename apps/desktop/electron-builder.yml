# Installers for Windows, macOS and Linux (electron-builder).
# Local: `pnpm --filter @vibe-coding-ide/desktop dist` builds for the current OS into apps/desktop/dist.
# CI: .github/workflows/release.yml builds all three and publishes a GitHub Release.
appId: io.github.julien-amar.vibe-coding-ide
productName: vibe-coding-ide
copyright: Copyright © 2026 vibe-coding-ide contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# The app is fully bundled by electron-vite into out/; node-pty (native) is the only runtime dependency.
files:
  - out/**
  - package.json
  # Licences of the bundled third-party logos.
  - THIRD-PARTY-NOTICES.md

# Native binaries cannot run from inside the asar archive.
asarUnpack:
  - '**/node_modules/node-pty/**'

# node-pty uses N-API (prebuilt / built at install time for the runner's OS), no rebuild for Electron needed.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  # Signed and notarized by the release workflow when the Apple secrets exist (scripts/release-build.cjs);
  # otherwise unsigned (users must right-click > Open the first time).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  # Defaults to the package name (@vibe-coding-ide/desktop), which is not a valid file name.
  executableName: vibe-coding-ide
  # The window's app id / WM_CLASS matches the generated vibe-coding-ide.desktop entry (desktopName in package.json).
  syncDesktopName: true
  category: Development
  maintainer: julien-amar <julien-amar@users.noreply.github.com>
  synopsis: Tabbed development environment
  target:
    - AppImage
    - deb

# Where the app looks for updates (electron-updater). The release workflow uploads the installers and
# the latest*.yml / *.blockmap files electron-builder generates for them (gh release); electron-builder
# itself never publishes (--publish never).
publish:
  provider: github
  owner: julien-amar
  repo: vibe-coding-ide
