# Builds the installers for Windows (NSIS .exe), macOS (.dmg, .zip) and
# Linux (.AppImage, .deb) and publishes them as a GitHub Release.
#
# Release:  git tag v0.2.0 && git push origin v0.2.0
#           (the app version is taken from the tag)
# Try out:  Actions > Release > Run workflow — builds the installers as
#           workflow artifacts without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git (the unit tests create repositories)
        run: |
          git config --global user.name "DevHub CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            const file = 'apps/desktop/package.json'
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
            pkg.version = process.argv[1].replace(/^v/, '')
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
            console.log('version', pkg.version)
          " "$GITHUB_REF_NAME"

      - name: Unit tests
        run: pnpm test

      - name: Build installers
        run: pnpm --filter @devhub/desktop dist
        env:
          # No signing certificates configured yet (installers are unsigned).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DevHub $GITHUB_REF_NAME" \
            --generate-notes
