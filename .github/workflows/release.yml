# Builds the installers for Windows (NSIS .exe), macOS (.dmg, .zip) and
# Linux (.AppImage, .deb) and publishes them as a GitHub Release.
#
# Release, either:
#   - push a tag:  git tag v0.2.0 && git push origin v0.2.0
#   - or Actions > Release > Run workflow with "tag" set to v0.2.0
#     (the tag is created on the commit the workflow runs on)
# The app version is taken from the tag.
# Try out: Run workflow with "tag" left empty builds the installers as
#          workflow artifacts without publishing anything.
# Installed apps update themselves from the latest release (the latest*.yml files uploaded with
# the installers). Signing: see apps/desktop/scripts/release-build.cjs.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.2.0). Leave empty to only build the installers.'
        required: false
        default: ''

permissions:
  contents: write

env:
  # The release tag: the pushed tag, or the one typed in "Run workflow" (empty = build only).
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git (the unit tests create repositories)
        run: |
          git config --global user.name "vibe-coding-ide CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the app version from the tag
        if: env.TAG != ''
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG' (expected e.g. v0.2.0)"
            exit 1
          fi
          node -e "
            const fs = require('fs')
            const file = 'apps/desktop/package.json'
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
            pkg.version = process.argv[1].replace(/^v/, '')
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
            console.log('version', pkg.version)
          " "$TAG"

      - name: Unit tests
        run: pnpm test

      # Signed when the repository has the signing secrets / variables, unsigned otherwise
      # (names in apps/desktop/scripts/release-build.cjs).
      - name: Build installers
        working-directory: apps/desktop
        run: node scripts/release-build.cjs
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            # What installed apps read to update themselves (electron-updater).
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          # --target: for a manual run the tag does not exist yet; it is created on this commit.
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "vibe-coding-ide $TAG" \
            --generate-notes
