# Runs on every push and pull request: type-check, unit tests (Vitest),
# build, and end-to-end tests (Playwright driving the built Electron app)
# on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git (the tests create repositories)
        run: |
          git config --global user.name "vibe-coding-ide CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Toolchains of the Tests panel's fixture projects (Rust and Maven come with the runners;
      # each framework's tests are skipped when its tool is missing).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Show the toolchains
        shell: bash
        run: |
          for c in "go version" "cargo --version" "dotnet --version" "mvn -v" "gradle -v"; do $c 2>&1 | head -1 || echo "$c: not available"; done

      # The Tests panel's pytest fixture runs with its own virtualenv, like a real Python project
      # (the pytest tests are skipped when it is missing).
      - name: Python environment for the pytest fixture
        shell: bash
        run: |
          venv=apps/desktop/e2e/fixtures/sample-tests/.venv
          python -m venv "$venv"
          if [ -x "$venv/bin/python" ]; then py="$venv/bin/python"; else py="$venv/Scripts/python.exe"; fi
          "$py" -m pip install --quiet pytest

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7
